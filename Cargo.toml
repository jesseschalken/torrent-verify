[package]
name = "torrent-verify"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.17", features = ["derive"] }
camino = "1.1.9"
anyhow = "1.0.86"
crypto = "0.5.1"
sha1 = "0.10.6"
generic-array = "1.1.0"
itertools = "0.13.0"
regex = "1.10.6"
log = "0.4.22"
rayon = "1.10.0"
unicode-normalization = "0.1.23"
base16ct = "0.2.0"
itoa = "1.0.15"
atoi = "2.0.0"
memmap2 = "0.9.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
